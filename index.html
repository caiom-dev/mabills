<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover habilita env(safe-area-inset-*) no iPhone. Sem isso a
      barra inferior fica atras do indicador de gestos e o topo, atras da ilha.

      maximum-scale=1 + user-scalable=no desligam o pinch zoom. Num SITE isso
      seria errado - o WCAG 1.4.4 exige poder ampliar o texto ate 200%, e
      bloquear zoom prejudica quem tem baixa visao. Aqui e diferente por dois
      motivos: este app roda instalado em tela cheia, onde dar zoom desalinha a
      barra fixa e a area segura sem nada para "voltar ao normal"; e o ajuste de
      acessibilidade continua disponivel no nivel certo, que e o do sistema
      (Ajustes > Tela e Brilho > Tamanho do Texto, ou o Zoom do iOS), valendo
      para todos os apps em vez de so para este.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="description" content="Controle de gastos e orçamento por categoria" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MaBills" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fcfcfb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1a19" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>MaBills</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
